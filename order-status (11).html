<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주문 조회 - 오륜 미네랄</title>
<meta property="og:title" content="미네랄 주문하기">
<meta property="og:description" content="신체의 완벽한 조화를 만드는">
<meta property="og:image" content="product-image.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#e8f8e0,#e3f2fd 50%,#f3e5f5);min-height:100vh;color:#2e3a3f}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 40px}
.header{text-align:center;margin-bottom:24px}
.header-img{width:100px;height:100px;object-fit:cover;border-radius:50%;margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.header h1{font-size:1.4rem;font-weight:700;color:#43a047}
.header p{color:#607d8b;font-size:.85rem;margin-top:4px}
.header-link{margin-top:12px}
.header-link a{color:#43a047;text-decoration:none;font-size:.85rem;padding:8px 18px;border:2px solid #43a047;border-radius:25px;font-weight:500}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #e8f5e9;display:flex;align-items:center;gap:8px}
.form-row{display:flex;gap:10px;margin-bottom:12px}
.form-group{flex:1;display:flex;flex-direction:column;min-width:0}
.form-group.name{flex:0.8}
.form-group.phone{flex:1.2}
.form-group label{font-size:.75rem;font-weight:600;margin-bottom:6px}
.form-group input{font-family:inherit;font-size:15px;padding:11px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fafafa;outline:none;width:100%}
.form-group input:focus{border-color:#43a047;background:#fff}
.btn-search{width:100%;padding:14px;background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
.btn-search:disabled{opacity:.6;cursor:not-allowed}
.result{display:none}
.result.active{display:block}
.no-result{text-align:center;padding:40px 20px;color:#607d8b}
.no-result .icon{font-size:3rem;margin-bottom:12px}
.order-card{border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;margin-bottom:16px}
.order-header{background:#e8f5e9;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.order-num{font-weight:700;color:#2e7d32;font-size:.9rem}
.order-date{font-size:.8rem;color:#607d8b}
.order-body{padding:16px}
.order-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:.9rem}
.order-row:last-child{border-bottom:none}
.order-row .label{color:#607d8b}
.order-row .value{font-weight:600;text-align:right}
.delivery-status{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:12px;margin:16px 0;font-size:1rem;font-weight:700}
.delivery-status .status-icon{font-size:1.5rem}
.delivery-status.pending{background:#fff3e0;color:#e65100}
.delivery-status.shipping{background:#e3f2fd;color:#1565c0}
.delivery-status.completed{background:#e8f5e9;color:#2e7d32}
.delivery-status.direct{background:#e8f5e9;color:#2e7d32}
.order-error-card{border:2px solid #f5a623;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#fff}
.order-error-head{background:#f5a623;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.order-error-head .oe-num{font-weight:700;font-size:.9rem}
.order-error-head .oe-date{font-size:.8rem;opacity:.95}
.order-error-body{padding:16px}
.order-error-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:12px;margin-bottom:14px;font-size:1.05rem;font-weight:700;background:#fff3e0;color:#e65100}
.order-error-reason{background:#fff8e1;border:1px solid #ffcc80;border-radius:10px;padding:14px;font-size:.9rem;color:#5d4037;line-height:1.7;margin-bottom:12px}
.order-error-reason b{color:#e65100}
.order-error-guide{background:#fff;border:1px dashed #ffb74d;border-radius:10px;padding:14px;font-size:.85rem;color:#5d4037;line-height:1.75;margin-bottom:12px}
.order-error-guide .oeg-title{font-weight:700;color:#e65100;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.order-error-guide .btn-kakao{display:flex;width:100%;max-width:none;margin-top:12px}
.tracking{margin-top:16px;padding:16px;background:linear-gradient(135deg,#e3f2fd,#bbdefb);border-radius:12px}
.tracking h5{font-size:.85rem;color:#1565c0;margin-bottom:10px}
.courier-name{font-size:.9rem;color:#1565c0;font-weight:600;margin-bottom:8px;padding:8px 12px;background:#fff;border-radius:8px;display:inline-block}
.tracking-num-box{display:flex;align-items:center;gap:10px;background:#fff;padding:12px;border-radius:8px;margin-bottom:12px}
.tracking-num-text{font-family:monospace;font-size:1rem;font-weight:700;color:#0d47a1;flex:1;word-break:break-all}
.btn-copy-track{padding:8px 16px;background:#1565c0;color:#fff;border:none;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn-track-link{display:block;width:100%;padding:12px;background:#1565c0;color:#fff;border:none;border-radius:25px;font-size:.9rem;font-weight:600;text-decoration:none;text-align:center;margin-top:10px}
.btn-track-link.cj{background:#d32f2f}
.btn-track-link.lotte{background:#e65100}
.btn-track-link.hanjin{background:#1565c0}
.btn-track-link.post{background:#43a047}
.btn-track-link.logen{background:#6d4c41}
.loading{text-align:center;padding:40px}
.loading-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#43a047;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#43a047;color:#fff;padding:12px 24px;border-radius:50px;font-size:.85rem;z-index:3000;display:none}

/* ===== 카카오톡 상담 카드 ===== */
.kakao-card{background:linear-gradient(135deg,#FEE500,#FFD600);border:none;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(254,229,0,.35)}
.kakao-msg{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.kakao-icon-big{font-size:2rem;line-height:1;flex-shrink:0}
.kakao-text{display:flex;flex-direction:column;min-width:0}
.kakao-title{font-size:.95rem;font-weight:700;color:#3C1E1E;margin:0}
.kakao-sub{font-size:.78rem;color:#5C3A1E;margin:2px 0 0;opacity:.85}
.btn-kakao{padding:11px 20px;background:#3C1E1E;color:#FEE500;border:none;border-radius:25px;font-size:.85rem;font-weight:700;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;transition:transform .15s,opacity .15s}
.btn-kakao:active{transform:translateY(1px);opacity:.9}
@media(max-width:480px){
  .kakao-card{flex-direction:column;align-items:stretch;text-align:center}
  .kakao-msg{justify-content:center}
  .btn-kakao{width:100%}
}
.tx-info{margin-top:20px;padding:16px;background:linear-gradient(135deg,#fff8e1,#ffecb3);border-radius:12px;border:2px solid #ffc107}
.tx-info h5{font-size:.9rem;color:#e65100;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tx-info-row{margin-bottom:16px}
.tx-info-label{font-size:.75rem;color:#795548;font-weight:600;margin-bottom:6px}
.tx-info-box{display:flex;align-items:center;gap:8px;background:#fff;padding:10px 12px;border-radius:8px;border:1px solid #ffe082}
.tx-info-text{font-family:monospace;font-size:.8rem;color:#5d4037;flex:1;word-break:break-all;line-height:1.4}
.btn-copy-tx{padding:6px 12px;background:#ff9800;color:#fff;border:none;border-radius:15px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-bscscan{display:block;width:100%;padding:10px;background:#3d5afe;color:#fff;border:none;border-radius:20px;font-size:.85rem;font-weight:600;text-decoration:none;text-align:center;margin-top:8px}
.tx-help{margin-top:12px;padding:12px;background:#fff;border-radius:8px;font-size:.75rem;color:#795548;line-height:1.6}
.tx-help strong{color:#e65100}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="product-image.png" alt="오륜 미네랄" class="header-img">
    <h1>📦 주문 조회</h1>
    <p>주문 상태 및 배송 추적</p>
    <div class="header-link"><a href="index.html">🛒 주문하기</a></div>
  </div>

  <div class="card">
    <div class="card-title">🔍 주문 조회</div>
    <div class="form-row">
      <div class="form-group name"><label>이름</label><input type="text" id="searchName" placeholder="홍길동"></div>
      <div class="form-group phone"><label>전화번호</label><input type="tel" id="searchPhone" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)"></div>
    </div>
    <button class="btn-search" id="btnSearch" onclick="searchOrder()">주문 조회하기</button>
  </div>

  <div class="card loading" id="loading" style="display:none">
    <div class="loading-spinner"></div>
    <p>조회 중...</p>
  </div>

  <div class="result" id="result"></div>

  <!-- ===== 카카오톡 상담 및 문의 카드 ===== -->
  <div class="card kakao-card">
    <div class="kakao-msg">
      <span class="kakao-icon-big">💬</span>
      <div class="kakao-text">
        <p class="kakao-title">문의사항이 있으신가요?</p>
        <p class="kakao-sub">카카오톡으로 빠르게 답변드려요</p>
      </div>
    </div>
    <a href="http://pf.kakao.com/_gcNxbX/chat" target="_blank" rel="noopener" class="btn-kakao">
      카카오톡 상담 →
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SHEET_URL  = 'https://script.google.com/macros/s/AKfycbyarlbJbpJRNnlbhqivPEv91TlKLRSQbdmSawNQH0noJXd7sOT_f22l5zDGMh02lyYg/exec';
var BACKUP_URL = 'https://script.google.com/macros/s/AKfycbw67RL6-9DB4AFmMzDAQxGc-rVmcCtj9ZFZ4KSJ1ilCu9f1rz32bxIizs3gJBrc2Nw/exec';

var COURIER_URLS = {
  'CJ대한통운': 'https://trace.cjlogistics.com/web/detail.jsp?slipno=',
  '롯데택배': 'https://www.lotteglogis.com/home/reservation/tracking/link?InvNo=',
  '한진택배': 'https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?wblnumString2=',
  '우체국': 'https://service.epost.go.kr/trace.RetrieveDomRi498Trace.do?sid1=',
  '로젠택배': 'https://www.ilogen.com/web/personal/trace/',
  'CJ': 'https://trace.cjlogistics.com/web/detail.jsp?slipno=',
  '롯데': 'https://www.lotteglogis.com/home/reservation/tracking/link?InvNo=',
  '한진': 'https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?wblnumString2=',
  '로젠': 'https://www.ilogen.com/web/personal/trace/'
};

var COURIER_CLASSES = {
  'CJ대한통운': 'cj', 'CJ': 'cj',
  '롯데택배': 'lotte', '롯데': 'lotte',
  '한진택배': 'hanjin', '한진': 'hanjin',
  '우체국': 'post',
  '로젠택배': 'logen', '로젠': 'logen'
};

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

function copyTracking(num) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(num).then(function() { toast('✅ 송장번호 복사됨!'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = num;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ 송장번호 복사됨!');
  }
}

function formatPhone(input) {
  var num = input.value.replace(/[^0-9]/g, '');
  if (num.length <= 3) input.value = num;
  else if (num.length <= 7) input.value = num.slice(0,3) + '-' + num.slice(3);
  else input.value = num.slice(0,3) + '-' + num.slice(3,7) + '-' + num.slice(7,11);
}

var _searchState = null;

function searchOrder() {
  var name = document.getElementById('searchName').value.trim();
  var phone = document.getElementById('searchPhone').value.trim();
  
  if (!name || !phone) {
    toast('이름과 전화번호를 입력하세요');
    return;
  }
  if (_searchState && !_searchState.done) {
    toast('조회 중입니다. 잠시만 기다려주세요');
    return;
  }

  var btn = document.getElementById('btnSearch');
  btn.disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').classList.remove('active');
  document.getElementById('result').innerHTML = '';

  _searchState = {
    name: name, phone: phone,
    mainResult: null, backupResult: null,
    done: false, mainCb: null, backupCb: null,
    fallbackTimer: null, finalTimer: null
  };

  callServer('main', SHEET_URL, name, phone);

  // ★ 조회는 메인 서버 전용 (백업엔 '오주문' 시트가 없어 오류건 누락됨)
  //   메인이 느려도 백업으로 넘기지 않고 최대 20초까지 대기
  _searchState.finalTimer = setTimeout(function() {
    if (_searchState && !_searchState.done) finishSearch(null, 'timeout');
  }, 20000);
}

function callServer(serverName, url, name, phone) {
  if (!url) return;
  var cbName = 'cb_' + serverName + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
  var src = url + '?action=search'
          + '&name=' + encodeURIComponent(name)
          + '&phone=' + encodeURIComponent(phone)
          + '&callback=' + cbName
          + '&_t=' + Date.now();
  
  if (serverName === 'main') _searchState.mainCb = cbName;
  else _searchState.backupCb = cbName;
  
  window[cbName] = function(result) {
    if (!_searchState || _searchState.done) return;
    if (serverName === 'main') _searchState.mainResult = result;
    else _searchState.backupResult = result;
    
    if (serverName === 'main' && result && result.success) {
      finishSearch(result, 'main');
      return;
    }
    if (serverName === 'backup' && result && result.success) {
      if (_searchState.mainResult && _searchState.mainResult.success) return;
      finishSearch(result, 'backup');
      return;
    }
  };
  
  var script = document.createElement('script');
  script.src = src;
  script.onerror = function() {
    if (!_searchState || _searchState.done) return;
    // ★ 조회는 메인 전용 — 메인 실패 시 백업으로 넘기지 않고 오류 처리
    _searchState.mainResult = { success: false, error: 'NETWORK_ERROR' };
    finishSearch(null, 'error');
  };
  document.body.appendChild(script);
}

function finishSearch(result, source) {
  if (!_searchState || _searchState.done) return;
  _searchState.done = true;
  
  if (_searchState.fallbackTimer) clearTimeout(_searchState.fallbackTimer);
  if (_searchState.finalTimer) clearTimeout(_searchState.finalTimer);
  try {
    if (_searchState.mainCb) delete window[_searchState.mainCb];
    if (_searchState.backupCb) delete window[_searchState.backupCb];
  } catch(e) {}
  
  document.getElementById('loading').style.display = 'none';
  document.getElementById('btnSearch').disabled = false;
  
  if (source === 'timeout') { toast('⏱️ 서버 응답이 없습니다. 잠시 후 다시 시도해주세요'); return; }
  if (source === 'error' || !result) { toast('❌ 조회 실패. 다시 시도해주세요'); return; }
  
  if (result.success && result.orders && result.orders.length > 0) {
    renderOrders(result.orders, source);
  } else {
    renderNoResult();
  }
}

function renderNoResult() {
  var r = document.getElementById('result');
  r.innerHTML = '<div class="card"><div class="no-result"><div class="icon">😢</div><h3>주문 내역 없음</h3><p>이름과 전화번호를 확인해주세요.</p></div></div>';
  r.classList.add('active');
}

function renderOrders(orders, source) {
  var r = document.getElementById('result');
  var groups = {};
  var groupOrder = [];
  for (var i = 0; i < orders.length; i++) {
    // 오류주문은 절대 그룹핑하지 않음 (개별 표시)
    var parent = orders[i].isError
      ? ('__err__' + i)
      : (orders[i].parentOrder || orders[i].orderNumber);
    if (!groups[parent]) { groups[parent] = []; groupOrder.push(parent); }
    groups[parent].push(orders[i]);
  }

  // ★ 모든 주문 표시 (오류건은 Apps Script에서 이미 최상단 정렬됨)
  var html = '';
  if (source === 'backup') {
    html += '<div class="card" style="background:#fff3e0;border:1px solid #ffb74d;padding:12px 16px;font-size:.85rem;color:#e65100">⚠️ 백업 서버 결과입니다. 최신 정보와 다를 수 있어요.</div>';
  }
  for (var g = 0; g < groupOrder.length; g++) {
    var group = groups[groupOrder[g]];
    if (group.length === 1) html += createCard(group[0]);
    else html += createGroupCard(groupOrder[g], group);
  }
  r.innerHTML = html;
  r.classList.add('active');
}

function createGroupCard(parentOrder, group) {
  var totalQty = 0;
  for (var i = 0; i < group.length; i++) {
    var q = parseInt(group[i].quantity);
    if (isNaN(q) || q === 0) {
      if (i === 0) { var amt = parseFloat(group[i].amount) || 0; q = Math.floor(amt / 10); }
      else q = 0;
    }
    totalQty += q;
  }
  
  var first = group[0];
  var amountText = first.amount ? first.amount + ' USDT' : '-';
  var dateText = first.timestamp ? formatDate(first.timestamp) : '-';
  
  var allShipped = true, anyShipped = false, allCompleted = true, anyCompleted = false;
  for (var j = 0; j < group.length; j++) {
    var s = group[j].status;
    var tn = String(group[j].trackingNumber || '').trim();
    var isShipped = (s === '배송중' || (tn && tn !== '0' && tn !== 'undefined'));
    if (isShipped) anyShipped = true; else allShipped = false;
    if (isShipped && isDeliveryCompleted(group[j].shippingDate)) anyCompleted = true;
    else allCompleted = false;
  }
  
  var overallStatus, statusColor;
  if (allCompleted && group.length > 0) { overallStatus = '전체 배송완료'; statusColor = '#2e7d32'; }
  else if (allShipped) { overallStatus = anyCompleted ? '일부 배송완료' : '전체 배송중'; statusColor = anyCompleted ? '#2e7d32' : '#1565c0'; }
  else if (anyShipped) { overallStatus = '부분 배송중'; statusColor = '#e65100'; }
  else { overallStatus = '배송준비중'; statusColor = '#607d8b'; }
  
  var html = '<div class="card order-card">' +
    '<div class="order-header"><span class="order-num">' + parentOrder + '</span><span class="order-date">' + dateText + '</span></div>' +
    '<div class="order-body">' +
      '<div class="order-row"><span class="label">총 주문 수량</span><span class="value">' + totalQty + '병 (' + group.length + '건 분할배송)</span></div>' +
      '<div class="order-row"><span class="label">송금 금액</span><span class="value">' + amountText + '</span></div>' +
      '<div class="order-row"><span class="label">배송지</span><span class="value">' + (first.address || '-') + '</span></div>' +
      '<div class="order-row"><span class="label">배송 현황</span><span class="value" style="color:' + statusColor + '">' + overallStatus + '</span></div>';
  for (var k = 0; k < group.length; k++) html += createSubOrderCard(group[k], k + 1, group.length);
  // txid/지갑은 분할 중 값이 있는 행을 사용
  var txHolder = first;
  for (var t = 0; t < group.length; t++) {
    if (String(group[t].txid || '').trim() || String(group[t].dmaxWallet || '').trim()) { txHolder = group[t]; break; }
  }
  html += buildTxInfoHTML(txHolder);
  html += '</div></div>';
  return html;
}

// TxID/지갑 확인 섹션 생성 (단일/그룹 공용)
function buildTxInfoHTML(order) {
  var txid = String(order.txid || '').trim();
  var wallet = String(order.dmaxWallet || '').trim();
  if (!txid && !wallet) return '';
  var h = '<div class="tx-info"><h5>💰 내 송금 정보 확인</h5>';
  if (txid) {
    var shortTxid = txid.length > 20 ? txid.substring(0, 10) + '...' + txid.substring(txid.length - 8) : txid;
    h += '<div class="tx-info-row">' +
      '<div class="tx-info-label">📋 내가 입력한 TxID (거래번호)</div>' +
      '<div class="tx-info-box"><span class="tx-info-text">' + shortTxid + '</span>' +
      '<button class="btn-copy-tx" onclick="copyTxText(\'' + txid + '\', \'TxID\')">복사</button></div></div>';
  }
  if (wallet) {
    var shortWallet = wallet.length > 20 ? wallet.substring(0, 8) + '...' + wallet.substring(wallet.length - 6) : wallet;
    h += '<div class="tx-info-row">' +
      '<div class="tx-info-label">👛 내가 주문서에 넣은 DMAX 스테이킹 지갑주소</div>' +
      '<div class="tx-info-box"><span class="tx-info-text">' + shortWallet + '</span>' +
      '<button class="btn-copy-tx" onclick="copyTxText(\'' + wallet + '\', \'지갑주소\')">복사</button></div></div>';
  }
  // ★ BscScan 확인 버튼은 한 번만 (TxID 기준)
  if (txid) {
    h += '<a href="https://bscscan.com/tx/' + txid + '" target="_blank" class="btn-bscscan">🔍 BscScan에서 거래 확인하기</a>';
  } else if (wallet) {
    h += '<a href="https://bscscan.com/address/' + wallet + '" target="_blank" class="btn-bscscan">🔍 BscScan에서 지갑 확인하기</a>';
  }
  h += '<div class="tx-help">💡 <strong>TxID를 잘못 넣으셨나요?</strong><br>' +
    '테더를 송금하신 거래소 또는 지갑에서 <strong>TxID (Hash ID)</strong>를 복사해 ' +
    '<strong>\'카카오톡 상담\'</strong> 채널로 관리자에게 알려주세요.' +
    '<br><br><a href="http://pf.kakao.com/_gcNxbX/chat" target="_blank" rel="noopener" class="btn-kakao" style="margin-top:4px">💬 카카오톡 상담 →</a></div></div>';
  return h;
}

function createSubOrderCard(order, idx, total) {
  var tn = String(order.trackingNumber || '').trim();
  var courier = String(order.courier || '').trim();
  var qty = order.quantity;
  if (qty === undefined || qty === '' || qty === null) {
    var amt = parseFloat(order.amount) || 0;
    qty = amt > 0 ? Math.floor(amt / 10) : '?';
  }
  
  var statusBadge = '';
  var trackingHTML = '';
  var deliveryState = getDeliveryStatus(order);
  
  if (deliveryState === 'direct') statusBadge = '<span style="color:#2e7d32;font-weight:600">🤝 직접전달</span>';
  else if (deliveryState === 'pending') statusBadge = '<span style="color:#e65100;font-weight:600">📦 배송준비중</span>';
  else {
    if (deliveryState === 'completed') statusBadge = '<span style="color:#2e7d32;font-weight:600">✅ 배송완료</span>';
    else statusBadge = '<span style="color:#1565c0;font-weight:600">🚚 배송중</span>';
    
    var trackURL = COURIER_URLS[courier] || '';
    var trackClass = COURIER_CLASSES[courier] || '';
    trackingHTML = '<div class="tracking" style="margin-top:8px">';
    if (courier) trackingHTML += '<div class="courier-name">📦 ' + courier + '</div>';
    trackingHTML += '<div class="tracking-num-box"><span class="tracking-num-text">' + tn + '</span><button class="btn-copy-track" onclick="copyTracking(\'' + tn + '\')">복사</button></div>';
    if (trackURL) trackingHTML += '<a href="' + trackURL + tn + '" target="_blank" class="btn-track-link ' + trackClass + '">📍 ' + courier + ' 배송조회</a>';
    trackingHTML += '</div>';
  }
  
  return '<div style="background:#f8f9fa;border-radius:10px;padding:14px;margin-top:12px;border-left:3px solid #43a047">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<span style="font-weight:700;font-size:.85rem;color:#2e3a3f">📦 ' + idx + '/' + total + '번 (' + qty + '병)</span>' + statusBadge +
    '</div>' + trackingHTML + '</div>';
}

function createCard(order) {
  // ★ 오주문(주문오류) → 전용 오류 카드
  if (order.isError) {
    var eDate = order.timestamp ? formatDate(order.timestamp) : '-';
    var reason = String(order.errorReason || '관리자에게 문의해주세요');
    var eTxInfo = buildTxInfoHTML(order);
    return '<div class="card order-error-card">' +
      '<div class="order-error-head">' +
        '<span class="oe-num">' + (order.orderNumber || '-') + '</span>' +
        '<span class="oe-date">' + eDate + '</span>' +
      '</div>' +
      '<div class="order-error-body">' +
        '<div class="order-error-badge">⚠️ 주문 오류</div>' +
        '<div class="order-error-reason"><b>사유:</b> ' + reason + '</div>' +
        '<div class="order-error-guide">' +
          '<div class="oeg-title">📌 이렇게 해주세요</div>' +
          '주문은 완료되었으나, 정보 오류로 배송이 지연되고 있습니다. ' +
          '사유를 확인하신 후, <b>송금 정보</b> 및 <b>지갑주소</b>를 다시 한번 확인하셔서 <b>카카오톡 채널</b>로 보내주세요. ' +
          '사유 표시가 없으면 카카오톡 채널로 바로 문의해 주시기 바랍니다.' +
          '<a href="http://pf.kakao.com/_gcNxbX/chat" target="_blank" rel="noopener" class="btn-kakao">💬 카카오톡 채널 문의 →</a>' +
        '</div>' +
        '<div class="order-row"><span class="label">주문 수량</span><span class="value">' + (order.quantity ? order.quantity + '병' : '-') + '</span></div>' +
        '<div class="order-row"><span class="label">송금 금액</span><span class="value">' + (order.amount ? order.amount + ' USDT' : '-') + '</span></div>' +
        eTxInfo +
      '</div>' +
    '</div>';
  }

  var tn = String(order.trackingNumber || '').trim();
  var courier = String(order.courier || '').trim();
  var deliveryHTML = '';
  var trackingHTML = '';
  var deliveryState = getDeliveryStatus(order);
  
  if (deliveryState === 'direct') deliveryHTML = '<div class="delivery-status direct"><span class="status-icon">🤝</span><span>직접전달</span></div>';
  else if (deliveryState === 'pending') deliveryHTML = '<div class="delivery-status pending"><span class="status-icon">📦</span><span>배송준비중</span></div>';
  else {
    if (deliveryState === 'completed') deliveryHTML = '<div class="delivery-status completed"><span class="status-icon">✅</span><span>배송완료</span></div>';
    else deliveryHTML = '<div class="delivery-status shipping"><span class="status-icon">🚚</span><span>배송중</span></div>';
    
    var trackURL = COURIER_URLS[courier] || '';
    var trackClass = COURIER_CLASSES[courier] || '';
    trackingHTML = '<div class="tracking"><h5>🚚 배송 정보</h5>';
    if (courier) trackingHTML += '<div class="courier-name">📦 ' + courier + '</div>';
    trackingHTML += '<div class="tracking-num-box"><span class="tracking-num-text">' + tn + '</span><button class="btn-copy-track" onclick="copyTracking(\'' + tn + '\')">복사</button></div>';
    if (trackURL) trackingHTML += '<a href="' + trackURL + tn + '" target="_blank" class="btn-track-link ' + trackClass + '">📍 ' + courier + ' 배송조회</a>';
    trackingHTML += '</div>';
  }

  // ★ 내 송금 정보 확인 (TxID / 지갑주소) ★
  var txInfoHTML = buildTxInfoHTML(order);

  var amountText = order.amount ? order.amount + ' USDT' : '-';
  var dateText = order.timestamp ? formatDate(order.timestamp) : '-';
  var displayStatus = order.status || '주문접수';
  var statusColor = '#43a047';
  if (deliveryState === 'completed') { displayStatus = '배송완료'; statusColor = '#2e7d32'; }

  return '<div class="card order-card">' +
    '<div class="order-header"><span class="order-num">' + (order.orderNumber || '-') + '</span><span class="order-date">' + dateText + '</span></div>' +
    '<div class="order-body">' +
      '<div class="order-row"><span class="label">주문 상태</span><span class="value" style="color:' + statusColor + '">' + displayStatus + '</span></div>' +
      '<div class="order-row"><span class="label">송금 금액</span><span class="value">' + amountText + '</span></div>' +
      '<div class="order-row"><span class="label">배송지</span><span class="value">' + (order.address || '-') + '</span></div>' +
      deliveryHTML + trackingHTML + txInfoHTML +
    '</div></div>';
}

function copyTxText(text, label) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast('✅ ' + label + ' 복사됨!'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ ' + label + ' 복사됨!');
  }
}

function formatDate(d) {
  if (!d) return '-';
  try {
    var date = new Date(d);
    if (isNaN(date.getTime())) return String(d);
    return date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
  } catch(e) { return String(d); }
}

function isDeliveryCompleted(shippingDate) {
  if (!shippingDate) return false;
  try {
    var shipDate = new Date(shippingDate);
    if (isNaN(shipDate.getTime())) return false;
    var diffDays = (new Date().getTime() - shipDate.getTime()) / (1000 * 60 * 60 * 24);
    return diffDays >= 3;
  } catch(e) { return false; }
}

function getDeliveryStatus(order) {
  var tn = String(order.trackingNumber || '').trim();
  var courier = String(order.courier || '').trim();
  if (courier === '직접전달' || tn === '직접전달') return 'direct';
  if ((!tn || tn === '0' || tn === 'undefined') && order.status !== '배송중') return 'pending';
  if (isDeliveryCompleted(order.shippingDate)) return 'completed';
  return 'shipping';
}

document.addEventListener('DOMContentLoaded', function() {
  try {
    var lastOrder = localStorage.getItem('lastOrder');
    if (lastOrder) {
      var order = JSON.parse(lastOrder);
      if (order.ordererName) document.getElementById('searchName').value = order.ordererName;
      if (order.ordererPhone) document.getElementById('searchPhone').value = order.ordererPhone;
    }
  } catch(e) {}
});

['searchName','searchPhone'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchOrder();
  });
});
</script>
